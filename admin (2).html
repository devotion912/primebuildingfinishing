<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime Building Finishing - Product Manager</title>
  <link rel="stylesheet" href="https://unpkg.com/netlify-cms@^2.10.192/dist/cms.css" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/netlify-cms@^2.10.192/dist/cms.js"></script>
  
  <script>
    // Custom product editor
    window.CMS_MANUAL_INIT = true;
    
    CMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main'
        },
        media_folder: 'uploads',
        public_folder: '/uploads',
        collections: [
          {
            name: 'products',
            label: '🚪 Products',
            folder: '_products',
            create: true,
            slug: '{{slug}}',
            fields: [
              {
                label: 'Product Name',
                name: 'name',
                widget: 'string',
                required: true
              },
              {
                label: 'Product ID',
                name: 'id',
                widget: 'string',
                required: true,
                hint: 'e.g., p01, p02 (must be unique)'
              },
              {
                label: 'Price (Naira)',
                name: 'price',
                widget: 'number',
                required: true,
                hint: 'e.g., 580000'
              },
              {
                label: 'Category',
                name: 'category',
                widget: 'select',
                options: ['entrance', 'interior', 'security', 'hardware'],
                required: true
              },
              {
                label: 'Description',
                name: 'description',
                widget: 'text',
                required: false
              },
              {
                label: 'Featured',
                name: 'featured',
                widget: 'boolean',
                default: false
              },
              {
                label: 'Door Type (for illustration)',
                name: 'door',
                widget: 'string',
                hint: 'e.g., grand, pivot, classic, security, etc.',
                required: false
              },
              {
                label: 'Product Image',
                name: 'image',
                widget: 'image',
                required: false,
                hint: 'Upload a photo of the door product'
              }
            ]
          },
          {
            name: 'settings',
            label: '⚙️ Site Settings',
            folder: '_settings',
            create: false,
            files: [
              {
                file: '_settings/config.md',
                label: 'Business Settings',
                name: 'config',
                fields: [
                  {
                    label: 'Business Name',
                    name: 'business_name',
                    widget: 'string'
                  },
                  {
                    label: 'Phone Number',
                    name: 'phone',
                    widget: 'string'
                  },
                  {
                    label: 'WhatsApp Number',
                    name: 'whatsapp',
                    widget: 'string'
                  },
                  {
                    label: 'Email',
                    name: 'email',
                    widget: 'string'
                  },
                  {
                    label: 'Tagline',
                    name: 'tagline',
                    widget: 'string'
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .cms-editor-visual-editor {
      background: #f5f5f5;
    }
  </style>
</body>
</html>
